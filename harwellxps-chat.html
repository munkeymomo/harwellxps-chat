<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarwellXPS Application Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #header { background: #1a3a5c; color: white; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
    #header .logo { width: 32px; height: 32px; background: #4a9eca; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
    #header .title { flex: 1; }
    #header .title h2 { font-size: 15px; font-weight: 600; margin: 0; }
    #header .title p { font-size: 11px; opacity: 0.75; margin: 0; }
    #header .status { display: flex; align-items: center; gap: 5px; font-size: 11px; opacity: 0.85; }
    #header .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4CAF50; }
    #header .status-dot.loading { background: #FFC107; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
    .message-wrapper { display: flex; flex-direction: column; gap: 4px; }
    .message-wrapper.user { align-items: flex-end; }
    .message-wrapper.assistant { align-items: flex-start; }
    .message { max-width: 78%; padding: 11px 15px; border-radius: 14px; line-height: 1.55; font-size: 14px; word-break: break-word; }
    .message.user { background: #1a3a5c; color: white; border-bottom-right-radius: 4px; }
    .message.assistant { background: white; color: #1a1a2e; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); white-space: pre-wrap; }
    .message-time { font-size: 10px; color: #9ca3af; padding: 0 4px; }
    .typing-indicator { display: flex; align-items: center; padding: 8px 0; }
    .typing-dots { display: flex; gap: 4px; background: white; border-radius: 14px; border-bottom-left-radius: 4px; padding: 11px 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; animation: typing 1.2s infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }
    #input-area { padding: 12px 16px; background: white; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
    #user-input { flex: 1; padding: 10px 14px; border: 1.5px solid #d1d5db; border-radius: 10px; font-size: 14px; outline: none; resize: none; font-family: inherit; line-height: 1.5; max-height: 120px; overflow-y: auto; transition: border-color 0.2s; }
    #user-input:focus { border-color: #1a3a5c; }
    #user-input::placeholder { color: #9ca3af; }
    #send-btn { width: 40px; height: 40px; background: #1a3a5c; color: white; border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0; }
    #send-btn:hover:not(:disabled) { background: #2a5a8c; }
    #send-btn:disabled { background: #d1d5db; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; }
    #error-banner { display: none; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 8px 12px; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
<div id="header">
  <div class="logo">H</div>
  <div class="title">
    <h2>HarwellXPS Application Assistant</h2>
    <p>Powered by AI · harwellxps.uk</p>
  </div>
  <div class="status">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Online</span>
  </div>
</div>
<div id="error-banner"></div>
<div id="chat-container"></div>
<div id="input-area">
  <textarea id="user-input" rows="1" placeholder="Type your message…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="send-btn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</div>
<script>
  const SEND_WEBHOOK  = 'https://hook.eu2.make.com/w97vru842f4t5e1cf468gmm8tcaafblz';
  const POLL_WEBHOOK  = 'https://hook.eu2.make.com/fc23r9g1exg7eq6sgfpvvvi86ybmcbys';
  const POLL_INTERVAL = 2000;
  const POLL_TIMEOUT  = 60000;

  const urlParams = new URLSearchParams(window.location.search);
  const userEmail = urlParams.get('email') || '';
  const conversationId = 'conv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

  const chatContainer = document.getElementById('chat-container');
  const userInput     = document.getElementById('user-input');
  const sendBtn       = document.getElementById('send-btn');
  const statusDot     = document.getElementById('status-dot');
  const statusText    = document.getElementById('status-text');
  const errorBanner   = document.getElementById('error-banner');

  function formatTime() {
    return new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(text, role) {
    const wrapper = document.createElement('div');
    wrapper.className = 'message-wrapper ' + role;
    const msg = document.createElement('div');
    msg.className = 'message ' + role;
    msg.textContent = text;
    const time = document.createElement('div');
    time.className = 'message-time';
    time.textContent = formatTime();
    wrapper.appendChild(msg);
    wrapper.appendChild(time);
    chatContainer.appendChild(wrapper);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function showTyping() {
    const w = document.createElement('div');
    w.className = 'typing-indicator';
    w.id = 'typing-indicator';
    const d = document.createElement('div');
    d.className = 'typing-dots';
    d.innerHTML = '<span></span><span></span><span></span>';
    w.appendChild(d);
    chatContainer.appendChild(w);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function setLoading(on) {
    sendBtn.disabled = on;
    statusDot.classList.toggle('loading', on);
    statusText.textContent = on ? 'Thinking\u2026' : 'Online';
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
    setTimeout(() => { errorBanner.style.display = 'none'; }, 5000);
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function pollForResponse() {
    return new Promise((resolve, reject) => {
      const deadline = Date.now() + POLL_TIMEOUT;
      async function attempt() {
        if (Date.now() > deadline) { reject(new Error('Timeout')); return; }
        try {
          const r = await fetch(POLL_WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversation_id: conversationId })
          });
          const data = await r.json();
          if (data.done && data.response) { resolve(data.response); }
          else { setTimeout(attempt, POLL_INTERVAL); }
        } catch { setTimeout(attempt, POLL_INTERVAL); }
      }
      attempt();
    });
  }

  async function callAndPoll(message) {
    setLoading(true);
    showTyping();
    try {
      fetch(SEND_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_email: userEmail, message: message, conversation_id: conversationId })
      });
      const response = await pollForResponse();
      hideTyping();
      addMessage(response, 'assistant');
    } catch (err) {
      hideTyping();
      showError('Sorry, something went wrong. Please try again.');
    } finally {
      setLoading(false);
      userInput.focus();
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || sendBtn.disabled) return;
    userInput.value = '';
    userInput.style.height = 'auto';
    errorBanner.style.display = 'none';
    addMessage(text, 'user');
    await callAndPoll(text);
  }

  window.addEventListener('load', () => {
    if (!userEmail) {
      addMessage("Hi! Please log in through the HarwellXPS portal to start an application.", 'assistant');
      sendBtn.disabled = true;
      userInput.disabled = true;
      userInput.placeholder = 'Please log in to continue';
      return;
    }
    setTimeout(() => callAndPoll('__INIT__'), 500);
  });
</script>
</body>
</html>
